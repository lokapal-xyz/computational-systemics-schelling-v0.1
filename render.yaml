# Public Solara dashboard. Render runs ordinary Python, so Mesa 3.5 and
# the threaded play controls work. Python 3.12 is pinned in .python-version
# because Mesa 3.5 requires it and Render's default may be newer.
services:
  - type: web
    name: schelling-operational-status
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: solara run app.py --production --host 0.0.0.0 --port $PORT --workers 1
